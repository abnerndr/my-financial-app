# Nixpacks configuration for Dokploy
# Use corepack to enable yarn (comes with Node.js 22)

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare yarn@1.22.22 --activate",
  "yarn install --frozen-lockfile --network-timeout 600000"
]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "yarn start"